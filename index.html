<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Website</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .calculator { margin-top: 20px; }
        input { margin: 5px; }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Real Estate Website</h1>
    </header>
    <section>
        <h2>Mortgage Calculator</h2>
        <div class="calculator">
            <label for="amount">Loan Amount:</label>
            <input type="number" id="amount" placeholder="Amount"> <br>
            <label for="interest">Interest Rate:</label>
            <input type="number" id="interest" placeholder="Rate"> <br>
            <label for="years">Years:</label>
            <input type="number" id="years" placeholder="Years"> <br>
            <button onclick="calculateMortgage()">Calculate</button>
        </div>
        <h3 id="output"></h3>
    </section>
    <script>
        function calculateMortgage() {
            const amount = parseFloat(document.getElementById('amount').value);
            const interest = parseFloat(document.getElementById('interest').value) / 100 / 12;
            const years = parseFloat(document.getElementById('years').value) * 12;
            const x = Math.pow(1 + interest, years);
            const monthly = (amount*x*interest) / (x-1);
            document.getElementById('output').innerText = `Monthly Payment: $${monthly.toFixed(2)}`;
        }
    </script>
</body>
</html>
